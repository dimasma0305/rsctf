[package]
name = "rsctf-storage-audit"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
axum = { version = "0.8", default-features = false }
base64 = "=0.22.1"
bytes = "=1.12.1"
futures = "=0.3.34"
hex = "=0.4.3"
libc = "=0.2.190"
nix = { version = "=0.31.3", features = ["fs"] }
object_store = { git = "https://github.com/apache/arrow-rs-object-store.git", rev = "18102f35d2c81dfbc9aefbb5797c33b39f2641d5", features = ["aws"] }
rand = "0.10"
serde_json = "=1.0.154"
sha2 = "=0.11.0"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
uuid = { version = "=1.28.0", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
