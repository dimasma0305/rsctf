[package]
name = "rsctf-checker-audit"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
libc = "=0.2.190"
nix = { version = "=0.31.3", features = ["fs"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "io-util", "process"] }
tracing = "0.1"
uuid = { version = "=1.28.0", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
