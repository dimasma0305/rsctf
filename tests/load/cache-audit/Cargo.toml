[package]
name = "rsctf-cache-audit"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
bytes = "=1.12.1"
libc = "=0.2.190"
moka = { version = "=0.12.16", features = ["future"] }
redis = { version = "=1.7.1", features = ["tokio-comp", "connection-manager", "aio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
