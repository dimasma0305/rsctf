[package]
name = "rsctf-retention-audit"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
