<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Boot2Root and Leaderboard King of the Hill formats</title>
  <desc id="desc">Boot2Root King of the Hill measures exclusive acquisition, control, and reliability on one shared machine. Leaderboard King of the Hill measures each completed result relative to the best result in the same wave and awards one small Crown premium. Both formats settle to a bounded score from zero to one hundred.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#222222"/>
    </marker>
    <pattern id="leader-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#dddddd" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="880" fill="#ffffff"/>
  <text x="72" y="66" fill="#111111" font-family="Georgia, 'DejaVu Serif', serif" font-size="43" font-weight="700">Two meanings of “hold the hill”</text>
  <text x="72" y="106" fill="#444444" font-family="'DejaVu Sans', sans-serif" font-size="21">Exclusive machine control and concurrent leaderboard dominance need different evidence</text>

  <g font-family="'DejaVu Sans', sans-serif">
    <rect x="72" y="150" width="700" height="540" rx="14" fill="#f4f4f4" stroke="#171717" stroke-width="4"/>
    <rect x="72" y="150" width="700" height="78" rx="14" fill="#1c1c1c"/>
    <rect x="72" y="204" width="700" height="24" fill="#1c1c1c"/>
    <text x="422" y="199" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">BOOT2ROOT KOTH</text>

    <rect x="112" y="266" width="620" height="114" rx="10" fill="#ffffff" stroke="#555555" stroke-width="2"/>
    <text x="144" y="305" fill="#111111" font-size="21" font-weight="800">ONE SHARED MACHINE · ONE OBSERVED HOLDER</text>
    <text x="144" y="340" fill="#333333" font-size="18">Exploit → claim → confirm → retain → defend service health</text>

    <g>
      <rect x="112" y="418" width="176" height="118" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
      <rect x="314" y="418" width="176" height="118" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
      <rect x="516" y="418" width="216" height="118" rx="10" fill="#ffffff" stroke="#333333" stroke-width="2"/>
      <text x="200" y="463" fill="#111111" font-size="30" font-weight="800" text-anchor="middle">A</text>
      <text x="200" y="501" fill="#444444" font-size="17" font-weight="700" text-anchor="middle">ACQUISITION</text>
      <text x="402" y="463" fill="#111111" font-size="30" font-weight="800" text-anchor="middle">C</text>
      <text x="402" y="501" fill="#444444" font-size="17" font-weight="700" text-anchor="middle">CONTROL</text>
      <text x="624" y="463" fill="#111111" font-size="30" font-weight="800" text-anchor="middle">R</text>
      <text x="624" y="501" fill="#444444" font-size="17" font-weight="700" text-anchor="middle">RELIABILITY</text>
    </g>

    <text x="422" y="588" fill="#111111" font-family="Georgia, 'DejaVu Serif', serif" font-size="21" font-weight="700" text-anchor="middle">100R(0.25A + 0.55C + 0.20√AC)</text>
    <rect x="217" y="618" width="410" height="46" rx="23" fill="#1c1c1c"/>
    <text x="422" y="648" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">CONSISTENCY = KEEP THE MACHINE</text>

    <rect x="828" y="150" width="700" height="540" rx="14" fill="url(#leader-grid)" stroke="#171717" stroke-width="4"/>
    <rect x="828" y="150" width="700" height="78" rx="14" fill="#4d4d4d"/>
    <rect x="828" y="204" width="700" height="24" fill="#4d4d4d"/>
    <text x="1178" y="199" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle">LEADERBOARD KOTH</text>

    <rect x="868" y="266" width="620" height="114" rx="10" fill="#ffffff" stroke="#555555" stroke-width="2"/>
    <text x="900" y="305" fill="#111111" font-size="21" font-weight="800">ONE OBJECTIVE SET · EVERY TEAM MAY SCORE</text>
    <text x="900" y="340" fill="#333333" font-size="18">Complete wave → compare with best → take or defend Crown</text>

    <g>
      <rect x="868" y="418" width="176" height="118" rx="10" fill="#ffffff" stroke="#555555" stroke-width="2"/>
      <rect x="1070" y="418" width="176" height="118" rx="10" fill="#ffffff" stroke="#555555" stroke-width="2"/>
      <rect x="1272" y="418" width="216" height="118" rx="10" fill="#ffffff" stroke="#555555" stroke-width="2"/>
      <text x="956" y="463" fill="#111111" font-size="30" font-weight="800" text-anchor="middle">E</text>
      <text x="956" y="501" fill="#444444" font-size="17" font-weight="700" text-anchor="middle">COMPLETION</text>
      <text x="1158" y="463" fill="#111111" font-size="30" font-weight="800" text-anchor="middle">R</text>
      <text x="1158" y="501" fill="#444444" font-size="17" font-weight="700" text-anchor="middle">RELATIVE RESULT</text>
      <text x="1380" y="463" fill="#111111" font-size="30" font-weight="800" text-anchor="middle">K</text>
      <text x="1380" y="501" fill="#444444" font-size="17" font-weight="700" text-anchor="middle">UNIQUE CROWN</text>
    </g>

    <text x="1178" y="579" fill="#111111" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" text-anchor="middle">100(0.95R + 0.05K)</text>
    <text x="1178" y="608" fill="#444444" font-family="Georgia, 'DejaVu Serif', serif" font-size="16" text-anchor="middle">R = (team result / wave best)^(3/4)</text>
    <rect x="973" y="618" width="410" height="46" rx="23" fill="#4d4d4d"/>
    <text x="1178" y="648" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle">ENGAGEMENT = COMPLETE EVERY WAVE</text>

    <line x1="422" y1="694" x2="422" y2="736" stroke="#222222" stroke-width="4"/>
    <line x1="1178" y1="694" x2="1178" y2="736" stroke="#222222" stroke-width="4"/>
    <line x1="422" y1="736" x2="1178" y2="736" stroke="#222222" stroke-width="4"/>
    <line x1="800" y1="736" x2="800" y2="772" stroke="#222222" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="330" y="780" width="940" height="70" rx="12" fill="#222222"/>
    <text x="800" y="810" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle">COMMON SETTLEMENT</text>
    <text x="800" y="836" fill="#eeeeee" font-size="16" text-anchor="middle">0–100 hill score → frozen hill normalization → finalized epoch average</text>
  </g>
</svg>
