name: rsctf-source-dev

# Reuse the repository's isolated PostgreSQL and Redis definitions. The
# backend below runs the locally linked binary inside the same Ubuntu/network
# boundary as the full development deployment, so source iteration does not
# rebuild a release image and A&D VPN validation remains meaningful.
include:
  - path: deploy/compose.development.yml

x-development-logging: &development-logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.development-runtime
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.rsctf-dev/runtime.container.env
        required: true
    environment:
      RSCTF_BIND: 0.0.0.0:8080
      RSCTF_DATABASE_URL: postgres://rsctf_dev:rsctf_dev@db:5432/rsctf_dev
      RSCTF_REDIS_URL: redis://redis:6379
      RSCTF_STATIC_DIR: /app/web/build
      RSCTF_STORAGE_ROOT: /data/files
      RSCTF_EVENT_VPN_HUB_ADDRESS: ${RSCTF_DEV_VPN_HUB_ADDRESS:-10.13.42.1}
      RSCTF_EVENT_VPN_INGRESS_IP: ${RSCTF_DEV_VPN_INGRESS_IP:-10.13.41.253}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${RSCTF_DEV_BACKEND_PORT:-18080}:8080"
      - "${RSCTF_DEV_SSH_PORT:-2223}:2223"
      - "${RSCTF_DEV_VPN_PORT:-51821}:51821/udp"
    volumes:
      - ${RSCTF_DEV_BINARY_DIR:-./.git/rsctf-target/debug}:/opt/rsctf-debug:ro
      - ${RSCTF_DEV_STORAGE_DIR:-./.rsctf-dev/files}:/data/files
      - ./web/build:/app/web/build:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        aliases:
          - rsctf-koth-backend
      ad:
        ipv4_address: ${RSCTF_DEV_AD_BACKEND_IP:-10.13.41.5}
    healthcheck:
      test:
        - CMD
        - /opt/rsctf-debug/rsctf
        - healthcheck
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 5s
      retries: 3
    logging: *development-logging

  # Keep a stable callback address across backend rebuilds. Managed KotH
  # targets are firewall-limited to this private endpoint, and the proxy talks
  # directly to the backend instead of depending on public DNS or ingress.
  koth-reporter:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    init: true
    command:
      - caddy
      - reverse-proxy
      - --from
      - :8080
      - --to
      - http://rsctf-koth-backend:8080
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # The upstream Caddy binary carries this file capability. Retain it in
      # the bounding set even though this proxy listens on unprivileged 8080.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /config:rw,nosuid,nodev,size=1m
      - /data:rw,nosuid,nodev,size=1m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    cpus: "0.25"
    mem_limit: 64m
    pids_limit: 64
    networks:
      default: {}
      ad:
        # Reserve the top address so Docker's low-address dynamic allocator
        # cannot hand the callback endpoint to a challenge first.
        ipv4_address: ${RSCTF_DEV_KOTH_REPORTER_IP:-10.13.41.254}
        aliases:
          - rsctf-koth-reporter
    logging: *development-logging

  # Resolve the normal browser hostname to the private TLS ingress while a
  # player is connected to the event tunnel. Sharing the backend namespace
  # lets CoreDNS bind only the WireGuard hub address; it is not published on
  # the host or any public Docker network.
  event-vpn-dns:
    image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    restart: unless-stopped
    init: true
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_healthy
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      RSCTF_DOMAIN: ${RSCTF_DEV_DOMAIN:-intechfest.1pc.tf}
      RSCTF_EVENT_VPN_HUB_ADDRESS: ${RSCTF_DEV_VPN_HUB_ADDRESS:-10.13.42.1}
      RSCTF_EVENT_VPN_INGRESS_IP: ${RSCTF_DEV_VPN_INGRESS_IP:-10.13.41.253}
    volumes:
      - ./deploy/event-vpn/Corefile:/etc/coredns/Corefile:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    logging: *development-logging

networks:
  ad:
    external: true
    name: rsctf-source-dev-ad
