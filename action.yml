name: Validate rsctf challenge repository
description: Validate a challenge repository and discover Docker builds with rsctf
author: rsctf

inputs:
  path:
    description: Repository root containing .gzevent
    required: false
    default: .
  image:
    description: Optional exact ghcr.io owner/repository image @sha256 digest
    required: false
    default: ''
  deny-warnings:
    description: Fail when rsctf reports a warning
    required: false
    default: 'true'
  github-annotations:
    description: Emit file annotations in the GitHub Actions log
    required: false
    default: 'true'

outputs:
  image:
    description: Immutable rsctf image reference used for validation
    value: ${{ steps.validate.outputs.image }}
  version:
    description: rsctf version used for validation
    value: ${{ steps.validate.outputs.version }}
  container_matrix:
    description: Dynamic GitHub matrix for repository-owned Docker build contexts
    value: ${{ steps.validate.outputs.container_matrix }}
  container_count:
    description: Number of repository-owned Docker build contexts
    value: ${{ steps.validate.outputs.container_count }}

runs:
  using: composite
  steps:
    - name: Validate and discover with rsctf
      id: validate
      shell: bash
      env:
        RSCTF_ACTION_DENY_WARNINGS: ${{ inputs.deny-warnings }}
        RSCTF_ACTION_GITHUB_ANNOTATIONS: ${{ inputs.github-annotations }}
        RSCTF_ACTION_IMAGE: ${{ inputs.image }}
        RSCTF_ACTION_PATH_INPUT: ${{ inputs.path }}
        RSCTF_ACTION_REF: ${{ github.action_ref }}
        RSCTF_ACTION_REPOSITORY: ${{ github.action_repository }}
      run: python3 "$GITHUB_ACTION_PATH/github-action/run.py"

branding:
  icon: check-circle
  color: green
