# Optional Attack-Defense stack. This implies the Docker challenge backend and
# runs the in-process WireGuard hub plus SSH bastion.
services:
  rsctf:
    user: "0:0"
    environment:
      RSCTF_CONTAINER_BACKEND: docker
      RSCTF_DOCKER_PUBLIC_ENTRY: ${RSCTF_DOCKER_PUBLIC_ENTRY:?Set a public host or IP}
      RSCTF_AD_SSH_PUBLIC_HOST: ${RSCTF_DOCKER_PUBLIC_ENTRY:?Set a public host or IP}
      RSCTF_AD_VPN_ENABLED: "true"
      RSCTF_AD_VPN_REQUIRED: "true"
      RSCTF_AD_VPN_CLIENT_CIDR: ${RSCTF_AD_VPN_CLIENT_CIDR:-10.13.0.0/19}
      RSCTF_AD_VPN_SERVICES_CIDR: ${RSCTF_AD_VPN_SERVICES_CIDR:-10.13.40.0/24}
      RSCTF_AD_VPN_SERVICES_NETWORK: ${RSCTF_AD_VPN_SERVICES_NETWORK:-${COMPOSE_PROJECT_NAME:-rsctf}-ad}
      RSCTF_AD_VPN_SERVER_ENDPOINT: ${RSCTF_AD_VPN_SERVER_ENDPOINT:?Set the public WireGuard host:port}
      RSCTF_AD_VPN_LISTEN_PORT: ${RSCTF_AD_VPN_PORT:-51820}
      RSCTF_AD_SSH_PORT: ${RSCTF_AD_SSH_PORT:-2222}
      RSCTF_TRUSTED_PROXY_CIDRS: ${RSCTF_TRUSTED_PROXY_CIDRS:-},${RSCTF_KOTH_REPORTER_UPSTREAM_IP:-172.31.251.254}/32
      RSCTF_KOTH_REPORTER_BASE_URL: ${RSCTF_KOTH_REPORTER_BASE_URL:-http://rsctf-koth-reporter:8080}
    cap_add:
      - NET_ADMIN
      # libxtables opens a raw socket while resolving `-m set` rules, even
      # though the underlying ipset and firewall mutations use NET_ADMIN.
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    ports:
      - ${RSCTF_AD_VPN_BIND_IP:-0.0.0.0}:${RSCTF_AD_VPN_PORT:-51820}:${RSCTF_AD_VPN_PORT:-51820}/udp
      - ${RSCTF_AD_SSH_BIND_IP:-0.0.0.0}:${RSCTF_AD_SSH_PORT:-2222}:${RSCTF_AD_SSH_PORT:-2222}/tcp
    networks:
      rsctf-ad: {}
      koth-reporter-upstream:
        aliases: [rsctf-koth-backend]

  # Targets cannot enter the VPN owner's INPUT namespace. Relay only reporter
  # requests through its separate application network; never open that firewall.
  koth-reporter:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      # Callback traffic must stay on the private app network, even on hosts
      # whose Docker client injects an outbound HTTP proxy.
      NO_PROXY: rsctf-koth-backend,localhost,127.0.0.1
      no_proxy: rsctf-koth-backend,localhost,127.0.0.1
    restart: unless-stopped
    init: true
    depends_on:
      rsctf:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    # Required by the upstream binary's file capability, even on port 8080.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./koth-reporter.Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:rw,nosuid,nodev,size=1m
      - /data:rw,nosuid,nodev,size=1m
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    cpus: "0.25"
    mem_limit: 64m
    pids_limit: 64
    networks:
      koth-reporter-upstream:
        ipv4_address: ${RSCTF_KOTH_REPORTER_UPSTREAM_IP:-172.31.251.254}
      rsctf-ad:
        ipv4_address: ${RSCTF_KOTH_REPORTER_IP:-10.13.40.254}
        aliases:
          - rsctf-koth-reporter
    logging:
      driver: local
      options:
        max-size: ${RSCTF_DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${RSCTF_DOCKER_LOG_MAX_FILES:-5}"

  # Opt in with COMPOSE_PROFILES=event-sensor. This sidecar shares only the
  # VPN network namespace, has no database credential/socket, and sheds
  # telemetry at fixed in-memory and database quotas instead of affecting play.
  rsctf-event-sensor:
    profiles: [event-sensor]
    image: ${RSCTF_IMAGE:?Set RSCTF_IMAGE to an immutable ghcr.io/dimasma0305/rsctf@sha256 digest}
    entrypoint: ["/usr/local/bin/rsctf-event-sensor"]
    restart: unless-stopped
    init: true
    user: "65532:65532"
    network_mode: service:rsctf
    depends_on:
      rsctf:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    environment:
      RSCTF_EVENT_SENSOR_API_URL: http://127.0.0.1:8080
      RSCTF_EVENT_SENSOR_TOKEN: ${RSCTF_EVENT_SENSOR_TOKEN:-}
      RSCTF_EVENT_SENSOR_INTERFACE: wg0
      RSCTF_EVENT_SENSOR_ASN_FILE: ${RSCTF_EVENT_SENSOR_ASN_FILE:-}
      RSCTF_EVENT_SENSOR_SPOOL_DIR: /var/lib/rsctf-event-sensor/spool
      RUST_LOG: ${RSCTF_EVENT_SENSOR_LOG:-info}
    volumes:
      - rsctf-event-sensor-spool:/var/lib/rsctf-event-sensor/spool
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777

networks:
  koth-reporter-upstream:
    internal: true
    ipam:
      config:
        - subnet: ${RSCTF_KOTH_REPORTER_UPSTREAM_SUBNET:-172.31.251.0/24}
  rsctf-ad:
    name: ${RSCTF_AD_VPN_SERVICES_NETWORK:-${COMPOSE_PROJECT_NAME:-rsctf}-ad}
    internal: true
    ipam:
      config:
        - subnet: ${RSCTF_AD_VPN_SERVICES_CIDR:-10.13.40.0/24}

volumes:
  rsctf-event-sensor-spool:
