# Same-origin private ingress for event-VPN browser and automation traffic.
# Merge after compose.caddy.yml and compose.ad-vpn.yml in an all-in-one
# deployment. The public hostname resolves to Caddy's private address only for
# VPN clients; Caddy preserves the exact WireGuard source for rsctf.
services:
  rsctf:
    environment:
      RSCTF_TRUSTED_PROXY_CIDRS: ${RSCTF_TRUSTED_PROXY_CIDRS:?Set this to the public Caddy address},${RSCTF_EVENT_VPN_INGRESS_IP:-10.13.40.253}/32
      RSCTF_EVENT_VPN_HUB_ADDRESS: ${RSCTF_EVENT_VPN_HUB_ADDRESS:-10.13.0.1}
      RSCTF_EVENT_VPN_INGRESS_IP: ${RSCTF_EVENT_VPN_INGRESS_IP:-10.13.40.253}
    networks:
      rsctf-ad:
        ipv4_address: ${RSCTF_EVENT_VPN_BACKEND_IP:-10.13.40.2}

  caddy:
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      RSCTF_AD_VPN_CLIENT_CIDR: ${RSCTF_AD_VPN_CLIENT_CIDR:-10.13.0.0/19}
      RSCTF_EVENT_VPN_BACKEND_IP: ${RSCTF_EVENT_VPN_BACKEND_IP:-10.13.40.2}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        ip route replace "$${RSCTF_AD_VPN_CLIENT_CIDR}" via "$${RSCTF_EVENT_VPN_BACKEND_IP}"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    networks:
      rsctf-ad:
        ipv4_address: ${RSCTF_EVENT_VPN_INGRESS_IP:-10.13.40.253}

  event-vpn-dns:
    image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    restart: unless-stopped
    init: true
    network_mode: service:rsctf
    depends_on:
      rsctf:
        condition: service_healthy
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      RSCTF_DOMAIN: ${RSCTF_DOMAIN:?Set RSCTF_DOMAIN in deploy/.env}
      RSCTF_EVENT_VPN_HUB_ADDRESS: ${RSCTF_EVENT_VPN_HUB_ADDRESS:-10.13.0.1}
      RSCTF_EVENT_VPN_INGRESS_IP: ${RSCTF_EVENT_VPN_INGRESS_IP:-10.13.40.253}
    volumes:
      - ./event-vpn/Corefile:/etc/coredns/Corefile:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: ${RSCTF_DOCKER_LOG_MAX_SIZE:-20m}
        max-file: "${RSCTF_DOCKER_LOG_MAX_FILES:-5}"

networks:
  rsctf-ad:
    name: ${RSCTF_AD_VPN_SERVICES_NETWORK:-${COMPOSE_PROJECT_NAME:-rsctf}-ad}
    internal: true
    ipam:
      config:
        - subnet: ${RSCTF_AD_VPN_SERVICES_CIDR:-10.13.40.0/24}
