packages:
  - "."

blockExoticSubdeps: true
minimumReleaseAge: 10080
# Dependabot updates lockfiles with --no-save and cannot answer pnpm's strict
# approval prompt. Its seven-day cooldown above enforces the same delay for
# routine version PRs; loose mode also leaves security updates unblocked.
minimumReleaseAgeStrict: false
trustPolicy: no-downgrade
trustPolicyExclude:
  # Babel still requires this mature release; pin the one reviewed exception.
  - "semver@6.3.1"
  # Node 22 declarations require this official undici type release, which was
  # published without the provenance attached to the prior patch.
  - "undici-types@6.20.0"

allowBuilds:
  esbuild: true

overrides:
  canvas: "npm:dry-uninstall"
  # Force-patch the transitive form-data CRLF-injection advisory (<4.0.6).
  form-data: ">=4.0.6"
  # The formatter's minimatch 9 branch cannot consume the only release that
  # fixes both 2026 brace-expansion denial-of-service advisories.
  "@trivago/prettier-plugin-sort-imports>minimatch": "10.2.5"
  "minimatch>brace-expansion": "5.0.9"
  # Patch the OpenAPI generator's AJV URI parser against host confusion.
  fast-uri: "3.1.5"

minimumReleaseAgeExclude:
  # Exact security hotfixes may bypass the seven-day cooldown; every unrelated
  # newly published version must still age normally.
  - react-router@8.3.0
  - brace-expansion@5.0.9
  - fast-uri@3.1.5
  - postcss@8.5.23
