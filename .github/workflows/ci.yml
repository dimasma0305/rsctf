name: Continuous integration

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsctf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsctf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RSCTF_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rsctf_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Test challenge validation action wrapper
        run: python3 github-action/test_run.py

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: server

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --all-features --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Validate bundled challenge repository with rsctf
        run: >-
          ./target/debug/rsctf challenge check
          --github
          --deny-warnings
          examples/challenge-repository

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

  coverage:
    name: Rust coverage and database regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsctf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsctf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RSCTF_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rsctf_test
      RSCTF_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview

      - name: Restore coverage build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      - name: Run default coverage suite
        run: cargo llvm-cov --all-targets --all-features --locked --no-report

      - name: Run database regressions and enforce coverage floor
        # Migration fixtures share database-scoped catalog state even though
        # their data lives in isolated schemas, so this half is deterministic
        # only when serialized. Live S3 and real-Docker checks remain explicit
        # environment tests rather than pretending to pass. The A&D scoring
        # regressions provision their own fully migrated event fixture here.
        run: >-
          cargo llvm-cov
          --no-clean
          --summary-only
          --all-targets
          --all-features
          --locked
          --ignore-filename-regex '(^|/)(target|migrations)/'
          --fail-under-lines 40
          --
          --ignored
          --test-threads=1
          --skip s3_round_trip
          --skip stale_conditional_delete_cannot_destroy_a_real_replacement_runtime
          --skip target_fk_deletes_scoped_tokens
          --skip ownership_constraints_are_validated_cascades
          --skip real_docker_large_file_and_fifo_are_bounded_without_exec
          --skip live_daemon_response_is_streamed_and_decoded
          --skip real_docker_reservation_waits_for_cleanup_claim_publication

  byoc-agent:
    name: BYOC agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents/byoc-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Restore BYOC agent build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: agents/byoc-agent -> target
          shared-key: byoc-agent

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  worker-plane-linux:
    name: Worker plane (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Restore worker build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            lib/worker-protocol -> target
            agents/worker-agent -> target
          shared-key: worker-plane-linux

      - name: Check protocol formatting
        run: cargo fmt --manifest-path lib/worker-protocol/Cargo.toml --all -- --check

      - name: Check agent formatting
        run: cargo fmt --manifest-path agents/worker-agent/Cargo.toml --all -- --check

      - name: Check protocol
        run: cargo check --manifest-path lib/worker-protocol/Cargo.toml --all-targets --locked

      - name: Check agent
        run: cargo check --manifest-path agents/worker-agent/Cargo.toml --all-targets --locked

      - name: Build release worker artifact
        run: >-
          cargo build --manifest-path agents/worker-agent/Cargo.toml
          --release --target x86_64-unknown-linux-musl --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path agents/worker-agent/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test protocol
        run: cargo test --manifest-path lib/worker-protocol/Cargo.toml --all-targets --locked

      - name: Test agent
        run: cargo test --manifest-path agents/worker-agent/Cargo.toml --all-targets --locked

      - name: Test Docker worker lifecycle
        shell: bash
        run: |
          docker build --tag rsctf-worker-smoke:ci \
            examples/challenge-repository/challenges/Jeopardy/Web/static-flag-service/src
          image_id="$(docker image inspect rsctf-worker-smoke:ci --format '{{.Id}}')"
          RSCTF_WORKER_TEST_IMAGE_ID="$image_id" \
            cargo test --manifest-path agents/worker-agent/Cargo.toml --locked \
            docker_workload_lifecycle_when_image_is_configured -- --nocapture

  worker-plane-windows:
    name: Worker compatibility (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUSTFLAGS: -Dwarnings -C target-feature=+crt-static
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Restore Windows worker build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            lib/worker-protocol -> target
            agents/worker-agent -> target
          shared-key: worker-plane-windows

      - name: Check protocol formatting
        run: cargo fmt --manifest-path lib/worker-protocol/Cargo.toml --all -- --check

      - name: Check agent formatting
        run: cargo fmt --manifest-path agents/worker-agent/Cargo.toml --all -- --check

      - name: Check Windows target
        run: cargo check --manifest-path agents/worker-agent/Cargo.toml --all-targets --target x86_64-pc-windows-msvc --locked

      - name: Run Windows Clippy
        run: cargo clippy --manifest-path agents/worker-agent/Cargo.toml --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings

      - name: Test protocol on Windows
        run: cargo test --manifest-path lib/worker-protocol/Cargo.toml --all-targets --target x86_64-pc-windows-msvc --locked

      - name: Test agent on Windows
        run: cargo test --manifest-path agents/worker-agent/Cargo.toml --all-targets --target x86_64-pc-windows-msvc --locked

      - name: Build release worker executable
        run: cargo build --manifest-path agents/worker-agent/Cargo.toml --release --target x86_64-pc-windows-msvc --locked

      - name: Validate Windows installer scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('scripts/bootstrap-worker.ps1', 'scripts/install-worker.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              throw "$script contains PowerShell syntax errors"
            }
          }
          $bootstrap = Get-Content -LiteralPath 'scripts/bootstrap-worker.ps1' -Raw
          if ($bootstrap -notmatch "Read-Host 'One-time enrollment token' -AsSecureString") { throw 'Windows token prompt is not hidden' }
          if ($bootstrap -notmatch "Read-Host 'Type DEDICATED to continue'") { throw 'Windows bootstrap does not require the host-boundary acknowledgement' }
          if ($bootstrap -notmatch '--token-stdin') { throw 'Windows enrollment does not use stdin' }
          if ($bootstrap -match '--token\s+\$plainToken|\?token=') { throw 'Windows bootstrap exposes the enrollment token' }
          if ($bootstrap -notmatch "Read-Host 'Type REMOVE to uninstall this worker'") { throw 'Windows uninstall does not require confirmation' }
          if ($bootstrap -notmatch 'RSCTF-managed containers or networks still exist') { throw 'Windows uninstall does not protect managed workloads' }
          if ($bootstrap -notmatch '& \$agentPath doctor') { throw 'Windows bootstrap does not run the worker preflight' }
          if ($bootstrap -notmatch '\$ServerUrl/healthz') { throw 'Windows bootstrap does not verify RSCTF readiness' }
          if ($bootstrap -notmatch 'Worker health check passed: mTLS control session accepted') { throw 'Windows bootstrap does not wait for an authenticated control session' }
          $installer = Get-Content -LiteralPath 'scripts/install-worker.ps1' -Raw
          if ($installer -notmatch 'New-ScheduledTaskTrigger -AtStartup') { throw 'Windows worker is not configured to start after reboot' }
          if ($installer -notmatch '--ready-file') { throw 'Windows worker task does not publish authenticated-session readiness' }
          if (-not $installer.Contains('$dockerDriver -ne ''windowsfilter''')) { throw 'Windows installer does not require enforceable storage quotas' }
          if (-not $installer.Contains('$acl.SetAccessRuleProtection($true, $false)')) { throw 'Windows installer does not remove inherited ACLs' }
          if ($installer -notmatch 'Protect-WorkerDirectory -Path \$stateDirectory -OwnerSid ''S-1-5-18''') { throw 'Windows state is not assigned to SYSTEM' }
          if ($installer -match 'icacls\.exe') { throw 'Windows installer uses locale-sensitive ACL tooling' }

      - name: Smoke-test worker executable
        shell: pwsh
        run: |
          $binary = "agents/worker-agent/target/x86_64-pc-windows-msvc/release/rsctf-worker-agent.exe"
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0) {
            throw "worker executable --version failed with exit code $LASTEXITCODE"
          }
          if ($version -notmatch '^rsctf-worker-agent ') {
            throw "worker executable returned an unexpected version string: $version"
          }

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4

      - name: Validate chart
        run: ./scripts/validate-helm-chart.sh

      - name: Validate Compose capability ownership
        run: ./scripts/validate-compose-security.sh

      - name: Verify PlatformProxy host-firewall isolation
        run: sudo ./scripts/test-docker-proxy-firewall.sh

  kubernetes-callback:
    name: Kubernetes KotH callback isolation
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: server

      - name: Compile production-policy emitter
        run: >-
          cargo test --locked --lib
          services::k8s::tests::emit_managed_koth_callback_policy_for_live_test
          --no-run

      - name: Install pinned Kubernetes tools
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/rsctf-kind \
            https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/rsctf-kind' \
            | sha256sum --check --strict
          curl --fail --silent --show-error --location \
            --output /tmp/rsctf-kubectl \
            https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          echo '629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  /tmp/rsctf-kubectl' \
            | sha256sum --check --strict
          sudo install -m 0755 /tmp/rsctf-kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/rsctf-kubectl /usr/local/bin/kubectl

      - name: Exercise callback DNS and NetworkPolicy
        run: ./scripts/test-kubernetes-koth-callback.sh

  web:
    name: React client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm --dir web audit --audit-level high

      - name: Lint frontend
        run: pnpm --dir web lint:check

      - name: Run frontend tests
        run: pnpm --dir web test

      - name: Build frontend
        run: pnpm --dir web build

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Reject reachable RSA timing vulnerability
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --target all --locked --prefix none)"
          reachable_rsa="$(awk '$1 == "rsa" { print }' <<<"$tree")"
          if [[ -n "$reachable_rsa" ]]; then
            echo "::error::RUSTSEC-2023-0071 is reachable in the compiled dependency graph."
            echo "$reachable_rsa"
            exit 1
          fi
          echo "rsa is lockfile-only through disabled sqlx-mysql features."

      - name: Audit Rust lockfile
        # rsa 0.9.10 is retained only in Cargo.lock metadata through sqlx-mysql.
        # The preceding graph check fails if that advisory ever becomes reachable.
        run: cargo audit --ignore RUSTSEC-2023-0071

  load-harness-contracts:
    name: Load harness contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/load
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Verify route catalogs, safety guards, and harness contracts
        env:
          # Pure harness tests mint only local fixture JWTs. This is deliberately
          # not a deployment secret and cannot authenticate to any installation.
          RSCTF_JWT_SECRET: rsctf-load-harness-ci-only-secret
        run: npm test

  cheat-acceptance:
    name: Isolated anti-cheat acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsctf_cheat_acceptance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsctf_cheat_acceptance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RSCTF_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rsctf_cheat_acceptance_test
      RSCTF_LOAD_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rsctf_cheat_acceptance_test
      RSCTF_REDIS_URL: redis://127.0.0.1:6379
      # Public, disposable fixture keys shared only by the loopback server and
      # its in-job harness; these are not deployment credentials or Actions secrets.
      RSCTF_JWT_SECRET: 7431daebc77ea0746e3211435476c7036185885298ed086551414338291857ab
      RSCTF_IDENTITY_HASH_KEY: b146b510c54c2079dc76f30ecb99e3ab493bda92f380f5b69026ed9c9d9e612c
      RSCTF_BIND: 127.0.0.1:8080
      RSCTF_PUBLIC_URL: http://127.0.0.1:8080
      RSCTF_COOKIE_SECURE: "false"
      RSCTF_TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      RSCTF_CONTAINER_BACKEND: none
      RSCTF_AD_VPN_ENABLED: "false"
      RSCTF_SUSPICION_RECONCILE_SECONDS: "1"
      RSCTF_SUSPICION_FINALIZE_GRACE_SECONDS: "1"
      TARGET: http://127.0.0.1:8080
      ORIGIN: http://127.0.0.1:8080
      CHEAT_ACCEPTANCE_ISOLATED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install native and PostgreSQL client dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends iptables libpcap-dev postgresql-client

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Restore anti-cheat acceptance build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cheat-acceptance

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Build and migrate the isolated application
        run: |
          cargo build --locked
          RSCTF_ROLE=migrate ./target/debug/rsctf

      - name: Run compact anti-cheat acceptance
        shell: bash
        run: |
          storage_root="$RUNNER_TEMP/rsctf-cheat-acceptance-storage"
          server_log="$RUNNER_TEMP/rsctf-cheat-acceptance.log"
          mkdir -p "$storage_root"
          # The checker preflight drops to an isolated uid before re-executing
          # rsctf. GitHub's workspace parents are not guaranteed traversable by
          # that uid, so install the already-built binary at a root-owned,
          # world-executable path just like the production image does.
          sudo install --owner=root --group=root --mode=0755 \
            ./target/debug/rsctf /usr/local/bin/rsctf-cheat-acceptance
          # The supported all-in-one role owns the reconciler and round engine.
          # Its checker sandbox preflight requires root privilege and iptables;
          # the application itself drops checker children into its UID pool.
          sudo --preserve-env env RSCTF_ROLE=all RSCTF_MIGRATE=0 \
            RSCTF_STORAGE_ROOT="$storage_root" \
            /usr/local/bin/rsctf-cheat-acceptance >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            sudo kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if [[ "$(curl --silent --output /tmp/rsctf-health-body --write-out '%{http_code}' \
                http://127.0.0.1:8080/healthz || true)" == "200" ]] && \
                [[ "$(cat /tmp/rsctf-health-body)" == "ok" ]]; then
              break
            fi
            if ! sudo kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            if [[ "$attempt" == "60" ]]; then
              cat "$server_log"
              exit 1
            fi
            sleep 1
          done
          acceptance_status=0
          npm --prefix tests/load run cheat-acceptance || acceptance_status=$?
          if [[ "$acceptance_status" != "0" ]]; then
            cat "$server_log"
            exit "$acceptance_status"
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0
          package_json_file: docs/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Generate journal PDFs
        run: pnpm --dir docs pdf

      - name: Build documentation
        run: pnpm --dir docs build

  repository-conventions:
    name: Repository conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install POSIX shell compatibility checker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends busybox-static

      - name: Enforce Rust file size limit
        shell: bash
        run: |
          oversized="$(find src agents/byoc-agent/src agents/worker-agent/src lib/worker-protocol/src -name '*.rs' -type f -print0 | xargs -0 wc -l | awk '$2 != "total" && $1 > 1000')"
          if [[ -n "$oversized" ]]; then
            echo "::error::Rust source files must not exceed 1000 lines. Split each oversized file into a cohesive folder module."
            echo "$oversized"
            exit 1
          fi
          echo "All Rust source files are within the 1000-line limit."

      - name: Validate worker installer packaging
        shell: bash
        run: |
          dash -n scripts/bootstrap-worker.sh scripts/install-worker.sh
          busybox sh -n scripts/bootstrap-worker.sh
          busybox sh -n scripts/install-worker.sh
          dash scripts/bootstrap-worker.sh --help >/dev/null
          busybox sh scripts/bootstrap-worker.sh --help >/dev/null
          dash scripts/install-worker.sh --help >/dev/null
          busybox sh scripts/install-worker.sh --help >/dev/null
          head -n 1 scripts/bootstrap-worker.sh | grep -qx '#!/bin/sh'
          head -n 1 scripts/install-worker.sh | grep -qx '#!/bin/sh'
          grep -q '"${SERVER_URL}/healthz"' scripts/bootstrap-worker.sh
          grep -q 'systemctl start docker.service' scripts/bootstrap-worker.sh
          grep -q 'systemctl enable docker.service' scripts/bootstrap-worker.sh
          grep -q 'rc-service docker start' scripts/bootstrap-worker.sh
          grep -q 'service docker start' scripts/bootstrap-worker.sh
          grep -q 'sv up docker' scripts/bootstrap-worker.sh
          if grep -Eq '\[\[|PIPESTATUS|BASH_SOURCE|mapfile|<<<|set -euo pipefail|--https-only|--secure-protocol' \
              scripts/bootstrap-worker.sh scripts/install-worker.sh; then
            echo "::error::The Linux worker lifecycle contains a Bash- or GNU-wget-only construct."
            exit 1
          fi
          if grep -Eq '(^|[[:space:]])curl([[:space:]]|$)' \
              scripts/bootstrap-worker.sh scripts/install-worker.sh; then
            echo "::error::The Linux worker lifecycle still requires curl instead of wget."
            exit 1
          fi
          if scripts/bootstrap-worker.sh \
            --server-url 'https://user@example.com' >/dev/null 2>&1; then
            echo "::error::The worker bootstrap accepted credentials in its server URL."
            exit 1
          fi
          if scripts/install-worker.sh --version latest >/dev/null 2>&1; then
            echo "::error::The worker installer accepted an invalid release version."
            exit 1
          fi
          test -x scripts/install-worker.sh
          test -x scripts/bootstrap-worker.sh
          test -x scripts/test-bootstrap-worker.sh
          test -f scripts/install-worker.ps1
          test -f scripts/bootstrap-worker.ps1
          test "$(stat -c '%a' scripts/bootstrap-worker.sh)" = "755"
          test "$(stat -c '%a' scripts/install-worker.sh)" = "755"
          test "$(stat -c '%a' agents/worker-agent/rsctf-worker-agent.service)" = "644"
          grep -q -- '--ready-file /run/rsctf-worker-agent/connected' \
            agents/worker-agent/rsctf-worker-agent.service
          systemd-analyze security --offline=yes \
            agents/worker-agent/rsctf-worker-agent.service >/dev/null
          scripts/test-install-worker.sh
          scripts/test-bootstrap-worker.sh

      - name: Validate deployment installer bootstrap
        shell: bash
        run: |
          bash -n scripts/install.sh scripts/test-install.sh scripts/test-install-shim.sh \
            scripts/docker-proxy-firewall.sh scripts/test-docker-proxy-firewall.sh
          dash -n scripts/docker-proxy-firewall.sh
          scripts/install.sh --help >/dev/null
          scripts/test-install.sh

      - name: Validate native image publication topology
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/image.yml
          if grep -q 'setup-qemu-action' "$workflow"; then
            echo "::error::Container publication must use native architecture runners, not QEMU."
            exit 1
          fi
          test "$(grep -c 'docker/github-builder/.github/workflows/build.yml@a492c6d04fd3315f67230809b44d60cc0acd50b3' "$workflow")" -eq 2
          grep -q '^  workflow_dispatch:$' "$workflow"
          if grep -q '^    branches:' "$workflow" || grep -q '^  pull_request:' "$workflow"; then
            echo "::error::Native container builds must remain manual; normal pushes and pull requests use application CI only."
            exit 1
          fi
          grep -q 'platforms: linux/amd64,linux/arm64' "$workflow"
          grep -q 'linux/arm64=ubuntu-24.04-arm' "$workflow"
          grep -q 'cache-scope: rsctf-byoc-agent' "$workflow"
          grep -q 'cache-scope: rsctf-image' "$workflow"
          test "$(grep -c 'type=raw,value=main' "$workflow" || true)" -eq 0
          grep -q 'source-ref refs/heads/main' "$workflow"
          grep -q 'type=sha,format=long,prefix=sha-' "$workflow"
          grep -q 'Promote attested images to main' "$workflow"
          grep -q 'for attempt in 1 2 3 4' "$workflow"
          grep -q 'docker logout "$GHCR_REGISTRY"' "$workflow"
          grep -q 'after four authenticated attempts' "$workflow"
          grep -q 'Promote verified commit images' "$workflow"

      - name: Validate layer-backed Rust dependency caches
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          chef = "lukemathwalker/cargo-chef:0.1.77-rust-1-bookworm@sha256:1689f62cfaa6603480356923cb5966544b2dd6ea523e30486bee4f149965d5bc"

          ["Dockerfile", "agents/byoc-agent/Dockerfile"].each do |path|
            source = File.read(path)
            abort "#{path} must pin the reviewed cargo-chef image" unless source.include?(chef)
            prepare = source.index("cargo chef prepare --recipe-path recipe.json")
            cook = source.index("cargo chef cook --release --locked --recipe-path recipe.json")
            build = source.index("cargo build --release --locked", cook)
            abort "#{path} must prepare, cook, then build" unless prepare && cook && build && prepare < cook && cook < build
            synthetic_edition_fix = source.lines.any? do |line|
              line.start_with?("RUN sed -i ") &&
                line.include?("edition =") &&
                line.include?("required-features") &&
                line.end_with?(" recipe.json\n")
            end
            abort "#{path} must remove cargo-chef's deprecated synthetic target editions" unless synthetic_edition_fix
            abort "#{path} hides the layer-backed target cache behind an ephemeral cache mount" if source.include?("type=cache,target=/app/target")
            abort "#{path} exports transient application build outputs" unless source.include?("rm -rf /app/target")
          end

          server = File.read("Dockerfile")
          builder_cook = server.index("cargo chef cook --release --locked --recipe-path recipe.json")
          runtime = server.index("FROM debian:bookworm-slim")
          runtime_packages = server.index("apt-get install", runtime)
          runtime_arg = server.index("ARG RSCTF_DEFAULT_BYOC_AGENT_IMAGE", runtime)
          runtime_multiarch_arg = server.index("ARG RSCTF_DEFAULT_BYOC_AGENT_MULTIARCH", runtime)
          runtime_env = server.index("ENV RSCTF_DEFAULT_BYOC_AGENT_IMAGE=", runtime)
          builder = server[builder_cook...runtime]
          abort "server compilation must not depend on the changing agent digest" if builder.include?("RSCTF_DEFAULT_BYOC_AGENT")
          abort "runtime package layer must not depend on the changing agent digest" unless runtime_arg && runtime_arg > runtime_packages
          abort "runtime image must retain companion multiarch metadata" unless runtime_multiarch_arg && runtime_multiarch_arg > runtime_packages
          abort "runtime image must expose the immutable companion metadata" unless runtime_env && runtime_env > runtime_arg
          RUBY

      - name: Validate publication critical-path gates
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"

          image_jobs = YAML.load_file(".github/workflows/image.yml", aliases: true).fetch("jobs")
          abort "server build must overlap quality checks" unless image_jobs.fetch("build-server").fetch("needs") == ["prepare", "build-agent"]
          abort "image publication must remain quality-gated" unless image_jobs.fetch("finalize-main").fetch("needs") == ["prepare", "quality", "build-agent", "build-server"]

          ci_source = File.read(".github/workflows/ci.yml")
          abort "standalone CI must not duplicate the reusable main-image quality gate" if ci_source.match?(/^  push:\s*$/)
          abort "CI must remain available to pull requests" unless ci_source.match?(/^  pull_request:\s*$/)
          abort "CI must remain reusable by the image workflow" unless ci_source.match?(/^  workflow_call:\s*$/)

          release_jobs = YAML.load_file(".github/workflows/worker-agent-release.yml", aliases: true).fetch("jobs")
          abort "tag publication must rely on the attested main image instead of rerunning full CI" if release_jobs.key?("verify")
          abort "Linux release builds must start after source validation" unless release_jobs.fetch("build-linux").fetch("needs") == ["validate-release-state"]
          abort "Windows release builds must start after source validation" unless release_jobs.fetch("build-windows").fetch("needs") == ["validate-release-state"]
          abort "release publication must wait for every worker artifact" unless release_jobs.fetch("publish").fetch("needs") == ["build-linux", "build-windows"]
          RUBY
