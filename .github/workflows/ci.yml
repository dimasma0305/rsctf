name: Continuous integration

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  plan:
    name: Select affected checks
    # Git/Node bookkeeping only; no compiler, services or privileged operations.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      server: ${{ steps.scope.outputs.server }}
      byoc: ${{ steps.scope.outputs.byoc }}
      worker: ${{ steps.scope.outputs.worker }}
      web: ${{ steps.scope.outputs.web }}
      docs: ${{ steps.scope.outputs.docs }}
      deployment: ${{ steps.scope.outputs.deployment }}
      security: ${{ steps.scope.outputs.security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan complete PR diff or full publication gate
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-plan.mjs

  rust-lint:
    name: Rust formatting and Clippy
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Restore lint metadata cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # Check-only metadata must not race the executable job's cache save.
          shared-key: server-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: |
          node scripts/check-architecture.mjs
          cargo fmt --all -- --check
          cargo fmt --manifest-path tests/load/retention-audit/Cargo.toml -- --check

      - name: Check isolated cleanup benchmark
        run: cargo check --manifest-path tests/load/retention-audit/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  rust:
    name: Rust
    needs: plan
    if: needs.plan.outputs.server == 'true'
    # Match the runtime integration runner's libc for shared executables.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsctf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsctf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RSCTF_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rsctf_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Test challenge validation action wrapper
        run: python3 github-action/test_run.py

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Compiling the large library and its test harness simultaneously exceeds
      # the bounded local runner's 12 GiB budget. Warm the normal library first;
      # dependencies still build in parallel and the second pass reuses it.
      - name: Build application binaries
        run: cargo build --all-features --locked

      - name: Build test targets
        run: cargo build --all-targets --all-features --locked

      - name: Test Docker idempotent retry lifecycle
        run: |
          docker build --tag rsctf-server-smoke:ci \
            examples/challenge-repository/challenges/Jeopardy/Web/static-flag-service/src
          image_id="$(docker image inspect rsctf-server-smoke:ci --format '{{.Id}}')"
          RSCTF_DOCKER_SCOPE="ci-server-retry" \
            RSCTF_REAL_DOCKER_RETRY_IMAGE="$image_id" \
            cargo test --locked retryable_flag_adopts_one_real_docker_workload -- --nocapture
          RSCTF_DOCKER_SCOPE="ci-server-image-repair" \
            RSCTF_DOCKER_PROXY_BIND="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')" \
            RSCTF_REAL_DOCKER_RETRY_IMAGE="rsctf-server-smoke:ci" \
            cargo test --locked first_start_publishes_repaired_image_without_a_retry -- --nocapture

      - name: Validate bundled challenge repository with rsctf
        run: >-
          ./target/debug/rsctf challenge check
          --github
          --deny-warnings
          examples/challenge-repository

      - name: Test Docker runtime profile ownership and shared capacity
        env:
          RSCTF_DOCKER_SCOPE: ci-runtime-profiles
          RSCTF_RUNTIME_PROFILE_TEST_IMAGE: docker.io/nginxinc/nginx-unprivileged@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
        run: |
          docker pull "$RSCTF_RUNTIME_PROFILE_TEST_IMAGE"
          cargo test --lib --all-features --locked real_docker_profiles -- --ignored --test-threads=1 --nocapture

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Stage same-run integration binaries
        run: |
          cargo test --all-targets --all-features --locked --no-run --message-format=json > "$RUNNER_TEMP/rsctf-test-artifacts.jsonl"
          test_binary="$(jq -rs '[.[] | select(.reason == "compiler-artifact" and .target.name == "rsctf" and .target.kind == ["lib"] and .profile.test == true and .executable != null)] | if length == 1 then .[0].executable else error("expected one rsctf library test binary") end' "$RUNNER_TEMP/rsctf-test-artifacts.jsonl")"
          install -D -m 0755 "$test_binary" ci-artifacts/rsctf-tests
          sandbox_binary="$(jq -rs '[.[] | select(.reason == "compiler-artifact" and .target.name == "checker_sandbox" and .profile.test == true and .executable != null)] | if length == 1 then .[0].executable else error("expected one checker sandbox test binary") end' "$RUNNER_TEMP/rsctf-test-artifacts.jsonl")"
          install -m 0755 "$sandbox_binary" ci-artifacts/checker-sandbox-tests
          install -m 0755 target/debug/rsctf ci-artifacts/rsctf
          # Keep symbols for backtraces, but do not transfer gigabytes of DWARF
          # debug sections to jobs that only execute these already-tested files.
          strip --strip-debug ci-artifacts/rsctf-tests ci-artifacts/checker-sandbox-tests ci-artifacts/rsctf
          printf '%s\n' "$GITHUB_SHA" > ci-artifacts/source-sha

      - name: Share tested binaries with isolated integration jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-server-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  coverage:
    name: Rust coverage and database regressions
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsctf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rsctf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres-second:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rsctf_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d rsctf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis-second:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RSCTF_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rsctf_test
      RSCTF_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpcap-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview

      - name: Restore coverage build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Verify browser for real OAuth cookie regression
        run: node --input-type=module -e "import { resolveChromium } from './tests/visual/cdp.mjs'; resolveChromium()"

      - name: Run default coverage suite
        run: cargo llvm-cov --all-targets --all-features --locked --no-report

      - name: Prepare real Docker snapshot recovery fixture
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends python3-venv
          docker build --tag rsctf-coverage-smoke:ci \
            examples/challenge-repository/challenges/Jeopardy/Web/static-flag-service/src
          printf 'RSCTF_REAL_DOCKER_RETRY_IMAGE=%s\n' "$(docker image inspect rsctf-coverage-smoke:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
          printf 'RSCTF_DOCKER_PROXY_BIND=%s\n' "$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')" >> "$GITHUB_ENV"
          printf 'RSCTF_DOCKER_SCOPE=ci-architecture-coverage\n' >> "$GITHUB_ENV"

      - name: Prepare disposable S3 file-upload fixture
        run: |
          docker run --detach --rm --name rsctf-coverage-s3 --cpus 1 --memory 1g \
            --publish 127.0.0.1:59000:9000 \
            --env RUSTFS_ACCESS_KEY=architecture-test \
            --env RUSTFS_SECRET_KEY=architecture-test-only-password \
            --env RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b /data
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            --max-time 2 --retry-max-time 60 http://127.0.0.1:59000/health
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            --max-time 2 --retry-max-time 60 --request PUT \
            --aws-sigv4 aws:amz:us-east-1:s3 --user architecture-test:architecture-test-only-password \
            http://127.0.0.1:59000/rsctf-coverage
          {
            printf 'RSCTF_S3_ENDPOINT=http://127.0.0.1:59000\n'
            printf 'RSCTF_S3_BUCKET=rsctf-coverage\n'
            printf 'RSCTF_S3_REGION=us-east-1\n'
            printf 'RSCTF_S3_ACCESS_KEY=architecture-test\n'
            printf 'RSCTF_S3_SECRET_KEY=architecture-test-only-password\n'
          } >> "$GITHUB_ENV"

      - name: Run database regressions and enforce coverage floor
        # Serial within each physical PostgreSQL/Redis pair. Separate schemas
        # or Redis DB indexes do not isolate catalogs or CLIENT KILL PUBSUB.
        # Discover every all-target executable with the same instrumentation;
        # preserve default profiles and require the exact disjoint test union.
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/llvm-cov-target"
          cargo llvm-cov show-env --export-prefix > "$RUNNER_TEMP/coverage.env"
          source "$RUNNER_TEMP/coverage.env"
          cargo test --all-targets --all-features --locked --no-run --message-format=json > "$RUNNER_TEMP/coverage-artifacts.jsonl"
          node scripts/coverage/run.mjs \
            "$RUNNER_TEMP/coverage-artifacts.jsonl" "$CARGO_LLVM_COV_TARGET_DIR" \
            scripts/coverage/services.json "$RUNNER_TEMP/coverage-partitions"
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex '(^|/)(target|migrations)/' --fail-under-lines 40

      - name: Retain partition diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-partitions-${{ github.sha }}
          path: |
            ${{ runner.temp }}/coverage-partitions/*.json
            ${{ runner.temp }}/coverage-partitions/*.log
          if-no-files-found: ignore
          retention-days: 3

  byoc-agent:
    name: BYOC agent
    needs: plan
    if: needs.plan.outputs.byoc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agents/byoc-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Restore BYOC agent build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: agents/byoc-agent -> target
          shared-key: byoc-agent
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  worker-plane-linux:
    name: Worker plane (Linux)
    needs: plan
    if: needs.plan.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Restore worker build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            lib/worker-protocol -> target
            agents/worker-agent -> target
          shared-key: worker-plane-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check protocol formatting
        run: cargo fmt --manifest-path lib/worker-protocol/Cargo.toml --all -- --check

      - name: Check agent formatting
        run: cargo fmt --manifest-path agents/worker-agent/Cargo.toml --all -- --check

      - name: Check protocol
        run: cargo check --manifest-path lib/worker-protocol/Cargo.toml --all-targets --locked

      - name: Build release worker artifact
        run: >-
          cargo build --manifest-path agents/worker-agent/Cargo.toml
          --release --target x86_64-unknown-linux-musl --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path agents/worker-agent/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test protocol
        run: cargo test --manifest-path lib/worker-protocol/Cargo.toml --all-targets --locked

      - name: Test agent
        run: cargo test --manifest-path agents/worker-agent/Cargo.toml --all-targets --locked

      - name: Test Docker worker lifecycle
        shell: bash
        run: |
          docker build --tag rsctf-worker-smoke:ci \
            examples/challenge-repository/challenges/Jeopardy/Web/static-flag-service/src
          image_id="$(docker image inspect rsctf-worker-smoke:ci --format '{{.Id}}')"
          RSCTF_WORKER_TEST_IMAGE_ID="$image_id" \
            cargo test --manifest-path agents/worker-agent/Cargo.toml --locked \
            docker_workload_lifecycle_when_image_is_configured -- --nocapture

  worker-plane-windows:
    name: Worker compatibility (Windows)
    needs: plan
    if: needs.plan.outputs.worker == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUSTFLAGS: -Dwarnings -C target-feature=+crt-static
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Restore Windows worker build cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            lib/worker-protocol -> target
            agents/worker-agent -> target
          shared-key: worker-plane-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check protocol formatting
        run: cargo fmt --manifest-path lib/worker-protocol/Cargo.toml --all -- --check

      - name: Check agent formatting
        run: cargo fmt --manifest-path agents/worker-agent/Cargo.toml --all -- --check

      - name: Run Windows Clippy
        run: cargo clippy --manifest-path agents/worker-agent/Cargo.toml --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings

      - name: Test protocol on Windows
        run: cargo test --manifest-path lib/worker-protocol/Cargo.toml --all-targets --target x86_64-pc-windows-msvc --locked

      - name: Test agent on Windows
        run: cargo test --manifest-path agents/worker-agent/Cargo.toml --all-targets --target x86_64-pc-windows-msvc --locked

      - name: Build release worker executable
        run: cargo build --manifest-path agents/worker-agent/Cargo.toml --release --target x86_64-pc-windows-msvc --locked

      - name: Validate Windows installer scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('scripts/bootstrap-worker.ps1', 'scripts/install-worker.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              throw "$script contains PowerShell syntax errors"
            }
          }
          $bootstrap = Get-Content -LiteralPath 'scripts/bootstrap-worker.ps1' -Raw
          if ($bootstrap -notmatch "Read-Host 'One-time enrollment token' -AsSecureString") { throw 'Windows token prompt is not hidden' }
          if ($bootstrap -notmatch "Read-Host 'Type DEDICATED to continue'") { throw 'Windows bootstrap does not require the host-boundary acknowledgement' }
          if ($bootstrap -notmatch '--token-stdin') { throw 'Windows enrollment does not use stdin' }
          if ($bootstrap -match '--token\s+\$plainToken|\?token=') { throw 'Windows bootstrap exposes the enrollment token' }
          if ($bootstrap -notmatch "Read-Host 'Type REMOVE to uninstall this worker'") { throw 'Windows uninstall does not require confirmation' }
          if ($bootstrap -notmatch 'RSCTF-managed containers or networks still exist') { throw 'Windows uninstall does not protect managed workloads' }
          if ($bootstrap -notmatch '& \$agentPath doctor') { throw 'Windows bootstrap does not run the worker preflight' }
          if ($bootstrap -notmatch '\$ServerUrl/healthz') { throw 'Windows bootstrap does not verify RSCTF readiness' }
          if ($bootstrap -notmatch 'Worker health check passed: mTLS control session accepted') { throw 'Windows bootstrap does not wait for an authenticated control session' }
          $installer = Get-Content -LiteralPath 'scripts/install-worker.ps1' -Raw
          if ($installer -notmatch 'New-ScheduledTaskTrigger -AtStartup') { throw 'Windows worker is not configured to start after reboot' }
          if ($installer -notmatch '--ready-file') { throw 'Windows worker task does not publish authenticated-session readiness' }
          if (-not $installer.Contains('$dockerDriver -ne ''windowsfilter''')) { throw 'Windows installer does not require enforceable storage quotas' }
          if (-not $installer.Contains('$acl.SetAccessRuleProtection($true, $false)')) { throw 'Windows installer does not remove inherited ACLs' }
          if ($installer -notmatch 'Protect-WorkerDirectory -Path \$stateDirectory -OwnerSid ''S-1-5-18''') { throw 'Windows state is not assigned to SYSTEM' }
          if ($installer -match 'icacls\.exe') { throw 'Windows installer uses locale-sensitive ACL tooling' }

      - name: Smoke-test worker executable
        shell: pwsh
        run: |
          $binary = "agents/worker-agent/target/x86_64-pc-windows-msvc/release/rsctf-worker-agent.exe"
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0) {
            throw "worker executable --version failed with exit code $LASTEXITCODE"
          }
          if ($version -notmatch '^rsctf-worker-agent ') {
            throw "worker executable returned an unexpected version string: $version"
          }

  helm-chart:
    name: Helm chart
    needs: plan
    if: needs.plan.outputs.deployment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4

      - name: Validate chart
        run: ./scripts/validate-helm-chart.sh

      - name: Validate Compose capability ownership
        run: ./scripts/validate-compose-security.sh

      - name: Verify PlatformProxy host-firewall isolation
        run: sudo ./scripts/test-docker-proxy-firewall.sh

  kubernetes-callback:
    name: Kubernetes KotH callback isolation
    needs: [plan, rust]
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpcap-dev

      - name: Download same-run tested binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-server-${{ github.sha }}
          path: ci-artifacts

      - name: Verify binary source
        run: |
          test "$(cat ci-artifacts/source-sha)" = "$GITHUB_SHA"
          chmod 0755 ci-artifacts/rsctf-tests

      - name: Install pinned Kubernetes tools
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/rsctf-kind \
            https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/rsctf-kind' \
            | sha256sum --check --strict
          curl --fail --silent --show-error --location \
            --output /tmp/rsctf-kubectl \
            https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          echo '629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7  /tmp/rsctf-kubectl' \
            | sha256sum --check --strict
          sudo install -m 0755 /tmp/rsctf-kind /usr/local/bin/kind
          sudo install -m 0755 /tmp/rsctf-kubectl /usr/local/bin/kubectl

      - name: Exercise callback DNS and NetworkPolicy
        env:
          RSCTF_K8S_TEST_BINARY: ${{ github.workspace }}/ci-artifacts/rsctf-tests
        run: ./scripts/test-kubernetes-koth-callback.sh

      - name: Install Helm for Kata runtime gate
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.4

      - name: Enable runner virtualization devices
        run: |
          sudo modprobe kvm_intel || sudo modprobe kvm_amd
          sudo modprobe vhost_vsock
          sudo modprobe vhost_net
          test -c /dev/kvm

      - name: Prove all runtime switch directions and Kata guest isolation
        env:
          RSCTF_ALLOW_RUNTIME_PROFILE_CLUSTER_TEST: '1'
          RSCTF_K8S_TEST_BINARY: ${{ github.workspace }}/ci-artifacts/rsctf-tests
        run: bash scripts/test-runtime-profiles.sh

  web:
    name: React client
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm --dir web audit --audit-level high

      - name: Lint frontend
        run: pnpm --dir web lint:check

      - name: Check generated API contract
        run: pnpm --dir web genapi:check

      - name: Run frontend tests
        env:
          # The standard public-repository Linux runner has four cores.
          RSCTF_FRONTEND_WORKERS: 4
        run: pnpm --dir web test

      - name: Build frontend
        run: pnpm --dir web build

      - name: Exercise account access in Chromium
        run: node tests/visual/account-access.mjs

      - name: Exercise team invites and canceled requests in Chromium
        run: node tests/visual/team-access.mjs

      - name: Exercise responsive design, retries, and account actions in Chromium
        run: node tests/visual/design-ux.mjs

      - name: Exercise runtime profile switching and live status badge in Chromium
        run: node tests/visual/runtime-profiles.mjs

      - name: Check delayed reads and live round layout stability in Chromium
        run: node tests/visual/layout-stability.mjs

      - name: Check navigation layout shifts under delayed loading
        run: node tests/visual/navigation-layout.mjs

      - name: Retain account access browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: account-access-${{ github.sha }}
          path: |
            visual-audit-output/account-access/
            visual-audit-output/team-access/
            visual-audit-output/design-ux/
            visual-audit-output/runtime-profiles/
            visual-audit-output/layout-stability/
            visual-audit-output/navigation-layout/
          if-no-files-found: ignore
          retention-days: 3

  layout-scan:
    name: Layout scan (${{ matrix.viewport }})
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [wide, desktop, mobile, compact]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - name: Scan every route and rendered popup family
        env:
          RSCTF_FULL_LAYOUT_VIEWPORTS: ${{ matrix.viewport }}
        run: node tests/visual/full-layout-scan.mjs
      - name: Retain layout evidence and coverage inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
